<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    width: 2500px; height: 1686px; overflow: hidden;
    background: #f6eedf;
    font-family: "PingFang TC", "Heiti TC", sans-serif;
    color: #463628;
  }
  .grid { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; height: 100%; }
  .cell {
    position: relative;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 40px;
  }
  .cell:nth-child(2)::before, .cell:nth-child(4)::before {
    content: ""; position: absolute; left: 0; top: 110px; bottom: 110px;
    width: 4px; border-radius: 2px; background: #e2cfa9;
  }
  .cell:nth-child(3)::after, .cell:nth-child(4)::after {
    content: ""; position: absolute; top: 0; left: 140px; right: 140px;
    height: 4px; border-radius: 2px; background: #e2cfa9;
  }
  .badge {
    width: 280px; height: 280px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    box-shadow: inset 0 0 0 10px rgba(255,255,255,.55);
  }
  .badge svg { width: 150px; height: 150px; stroke: #fffaf0; stroke-width: 9; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .avatar { width: 280px; height: 280px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 10px #8aa6a3; }
  .label { font-size: 150px; font-weight: 600; letter-spacing: 12px; line-height: 1; }
  .hint { font-size: 64px; color: #8a7458; letter-spacing: 4px; line-height: 1; }
</style>
</head>
<body>
<div class="grid">
  <div class="cell">
    <div class="badge" style="background:#c46a46">
      <svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="24"/><path d="M21 33l8 8 15-17"/></svg>
    </div>
    <div class="label">簽到</div>
    <div class="hint">例會當天一鍵簽到</div>
  </div>
  <div class="cell">
    <div class="badge" style="background:#6f9895">
      <svg viewBox="0 0 64 64" style="fill:#fffaf0;stroke:none"><rect x="9" y="9" width="20" height="20" rx="5"/><rect x="35" y="9" width="20" height="20" rx="5"/><rect x="9" y="35" width="20" height="20" rx="5"/><rect x="35" y="35" width="20" height="20" rx="5"/></svg>
    </div>
    <div class="label">座位</div>
    <div class="hint">今天坐在哪裡</div>
  </div>
  <div class="cell">
    <div class="badge" style="background:#c9952f">
      <svg viewBox="0 0 64 64"><path d="M32 8l7 15 16 2-12 11 3 16-14-8-14 8 3-16L9 25l16-2z"/></svg>
    </div>
    <div class="label">投票</div>
    <div class="hint">長冠軍之星</div>
  </div>
  <div class="cell">
    <img class="avatar" src="../a-qi-v1.webp" alt="">
    <div class="label">說明</div>
    <div class="hint">阿麒可以幫你什麼</div>
  </div>
</div>
</body>
</html>
